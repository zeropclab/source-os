name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Report existing repository lint debt (non-blocking during ratchet)
        run: ruff check . --output-format concise || true
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.py')
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs ruff check
            printf '%s\n' "$changed_files" | xargs ruff format --check
          else
            echo "No Python files changed."
          fi
      - name: Report existing repository type debt (non-blocking during ratchet)
        run: mypy --explicit-package-bases packages/ apps/ --ignore-missing-imports || true

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sourceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://runner:test@localhost:5432/sourceos_test
          REDIS_URL: redis://localhost:6379/0
          STORAGE_ROOT: /tmp/sourceos-test
